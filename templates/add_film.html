<!DOCTYPE html>
<html>
<head>
    <title>Filmavault - Add Film</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "nav.html" %}
    <h1>Add a Film</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/add_film">
        <p>Film ID: <input type="text" name="film_id" required></p>
        <p>Film Name: <input type="text" name="film_name" required></p>
        <p>Genre: <input type="text" name="genre"></p>
        <p>Director:
            <select name="director_id" required>
                {% for director in directors %}
                <option value="{{ director['director_id'] }}">{{ director['director_name'] }}</option>
                {% endfor %}
            </select>
        </p>
        <p><input type="submit" value="Add Film"></p>
    </form>
</body>
</html>
