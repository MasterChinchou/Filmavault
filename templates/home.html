<!DOCTYPE html>
<html>
<head>
    <title>Filmavault - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "nav.html" %}

    <div class="hero">
        <h1>Welcome to Filmavault</h1>
        <p>Cinema staff information system</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number">{{ film_count }}</div>
            <div class="stat-label">Films in catalogue</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">{{ cinema_count }}</div>
            <div class="stat-label">Cinemas</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">{{ ticket_count }}</div>
            <div class="stat-label">Tickets sold</div>
        </div>
    </div>
</body>
</html>
