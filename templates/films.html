<!DOCTYPE html>
<html>
<head>
    <title>Filmavault - Films</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "nav.html" %}
    <h1>All Films</h1>
    <table border="1">
        <tr>
            <th>Film Name</th>
            <th>Director</th>
            <th>Genre</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
        {% for film in films %}
        <tr>
            <td>{{ film["film_name"] }}</td>
            <td>{{ film["director_name"] }}</td>
            <td>{{ film["genre"] }}</td>
            <td><a href="/edit_film/{{ film["film_id"] }}">Edit</a></td>
         <td><a href="/delete_film/{{ film["film_id"] }}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
