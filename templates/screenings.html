# Screenings page template for Filmavault website
<!DOCTYPE html>
<html>
<head>
    <title>Filmavault - Screenings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "nav.html" %}
    <h1>What's Showing</h1>
    <table border="1">
        <tr>
            <th>Film</th>
            <th>Cinema</th>
            <th>Session Time</th>
        </tr>
        {% for screening in screenings %}
        <tr>
            <td>{{ screening["film_name"] }}</td>
            <td>{{ screening["city"] }}</td>
            <td>{{ screening["session_time"] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
